name: verify-sources

# 每天检查一次上游规则源的可达性与内容漂移，结果写进 STATUS.md。
# 发现异常（不可达 / 条数骤降 / 字节缩水）时开一个 issue，并在已有 issue 上追加。
on:
  schedule:
    - cron: '0 1 * * *'      # 01:00 UTC = 09:00 UTC+8
  push:
    paths:
      - 'sources.json'
      - 'scripts/verify.py'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 校验上游
        id: verify
        continue-on-error: true
        run: python3 scripts/verify.py --quiet

      - name: 写 STATUS.md
        run: |
          {
            echo "# 上游校验状态"
            echo
            echo "最近一次运行：$(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo '```'
            # `|| true` 是必须的：verify.py 发现异常时返回 1，会把本步骤直接打挂，
            # 导致「提交 STATUS.md」「异常时开 issue」两步被跳过 —— 实测 2026-09-24~27
            # 连续 4 天失败期间，一个 issue 都没建出来。异常与否由下一步的 outcome 判定。
            python3 scripts/verify.py || true
            echo '```'
            echo
            echo "> 本文件由 verify-sources workflow 自动生成，不要手动编辑。"
          } > STATUS.md

      - name: 提交 STATUS.md
        run: |
          if [ -z "$(git status --porcelain STATUS.md)" ]; then
            echo "STATUS.md 无变化"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STATUS.md
          git commit -m "chore: 更新上游校验状态"
          git push

      - name: 异常时开 issue
        if: steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="上游规则源校验异常"
          BODY="$(printf '自动校验发现异常，请查看 `STATUS.md` 与 Actions 日志。\n\n```\n%s\n```\n' "$(python3 scripts/verify.py 2>&1 | tail -20)")"
          # 用「标题精确匹配」而不是 --search 全文检索：中文标题走搜索 API 不稳定，
          # 匹配不到就会每次新建一个重复 issue。
          EXISTING="$(gh issue list --state open --limit 100 --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
            echo "已追加到 issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: 异常时让本次运行失败
        # 放在最后：STATUS.md 已提交、issue 已建，此时再标失败，
        # 既能触发 GitHub 的失败通知，又不会让前面的告警动作被跳过。
        if: steps.verify.outcome == 'failure'
        run: |
          echo "::error::上游校验发现异常，详见 STATUS.md 与 open issue"
          exit 1
