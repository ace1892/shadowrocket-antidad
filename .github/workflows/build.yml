name: build-modules

# 重建 modules/*.module。
#
# 两个触发源：
#   1. push  —— 改动 whitelist.txt / sources.json / scripts/ 之后
#      （触发路径不含 modules/，所以不会有「提交→触发→再提交」的循环）
#   2. 每日定时 —— 必需。因为 bm-keyword-ip / bm-lite 这两个上游文件是
#      「关键词 + IP + URL-REGEX」混装，本项目用 inline_filtered 在构建时
#      剔除 URL-REGEX 后内联进模块。上游每 1~2 天更新一次，没有定时就吃不到更新。
#      域名主体走 DOMAIN-SET 远程引用，不受此影响，始终跟随上游。
on:
  push:
    paths:
      - 'whitelist.txt'
      - 'sources.json'
      - 'scripts/**'
      - '.github/workflows/build.yml'   # 改工作流本身也要跑一次，否则新加的步骤永远不会被验证
  schedule:
    - cron: '30 20 * * *'    # 20:30 UTC = 04:30 UTC+8（bm7 的更新一般在 UTC 20:40 之后，留一点余量）
  workflow_dispatch:

permissions:
  contents: write

# 与 verify-sources 共用同一个仓库写权限，串行化避免 push 打架。
concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 重建 modules
        run: python3 scripts/build.py

      - name: 校验 MITM 覆盖（规则目标必须全部被声明，否则静默失效）
        run: python3 scripts/check_mitm.py

      - name: 校验层级（域名级只管域名、URL 级只管 URL）
        run: python3 scripts/audit_layers.py

      - name: 提交变化
        run: |
          if [ -z "$(git status --porcelain modules/)" ]; then
            echo "modules/ 无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/
          git commit -m "chore: 由 build.py 重建 modules"
          git pull --rebase --autostash origin main
          git push

      # 同 divert.yml：jsDelivr 对 @main 分支别名有 CDN 缓存，不会随新提交自动失效。
      # 模块也是走 cdn.jsdelivr.net/...@main/modules/xxx.module 安装的，不 purge 就会
      # 出现「仓库已更新、手机里还是旧模块」。放在 push 之后回源。
      - name: 刷新 jsDelivr CDN 缓存（模块）
        run: |
          BASE="https://purge.jsdelivr.net/gh/ace1892/shadowrocket-antidad@main/modules"
          FAIL=0
          for F in antidad-full antidad-lite antidad-rewrite antidad-splash antidad-strict antidad-zhihu; do
            OUT="$(curl -s --max-time 30 "$BASE/$F.module" || true)"
            if echo "$OUT" | grep -q '"status": "finished"'; then
              echo "$F.module  purge 成功"
            else
              echo "$F.module  purge 未确认：$OUT"
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            echo "::warning::部分模块的 jsDelivr purge 未确认成功，@main 可能仍为旧内容"
          fi
