name: build-modules

# 改动 whitelist.txt / sources.json / build.py 之后自动重建 modules/*.module。
# 触发路径不含 modules/，所以不会有「提交→触发→再提交」的循环。
on:
  push:
    paths:
      - 'whitelist.txt'
      - 'sources.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 重建 modules
        run: python3 scripts/build.py

      - name: 校验 MITM 覆盖（规则目标必须全部被声明，否则静默失效）
        run: python3 scripts/check_mitm.py

      - name: 提交变化
        run: |
          if [ -z "$(git status --porcelain modules/)" ]; then
            echo "modules/ 无变化，跳过提交"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/
          git commit -m "chore: 由 build.py 重建 modules"
          git push
